<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Tugas</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding-top: 50px; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 15px; display: inline-block; width: 90%; max-width: 350px; border: 1px solid #333; }
        #timer { font-size: 40px; margin: 15px 0; color: #ffcc00; font-weight: bold; }
        .tombol { background: #ff4757; color: white; padding: 15px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: none; width: 100%; font-size: 16px; }
        .kode { background: #333; padding: 15px; border-radius: 8px; color: #00ff00; font-size: 28px; margin-top: 15px; display: none; border: 1px dashed #777; font-weight: bold; letter-spacing: 3px; }
    </style>
</head>
<body>

<div class="box" id="mainBox">
    <h3 id="judul">Tunggu bentar ya...</h3>
    <div id="timer">15</div>
    <button id="btn" class="tombol" onclick="ambil()">KLIK BUAT AMBIL KODE</button>
    <div id="hasil" class="kode"></div>
</div>

<script>
    // CEK IP INDONESIA (ANTI-VPN)
    fetch('https://ipapi.co/json/').then(res => res.json()).then(data => {
        if (data.country !== "ID") {
            document.getElementById('mainBox').innerHTML = "<h3>AKSES DITOLAK</h3><p>Matikan VPN dan gunakan IP Indonesia!</p>";
        } else {
            mulaiTimer();
        }
    }).catch(() => mulaiTimer());

    function mulaiTimer() {
        let detik = 15;
        let hitung = setInterval(() => {
            detik--;
            document.getElementById('timer').innerText = detik;
            if (detik <= 0) {
                clearInterval(hitung);
                document.getElementById('timer').style.display = 'none';
                document.getElementById('btn').style.display = 'block';
                document.getElementById('judul').innerText = "Tugas Selesai!";
            }
        }, 1000);
    }

    function ambil() {
        // --- PASANG LINK IKLAN KAMU DI SINI ---
        window.open("https://www.google.com", "_blank"); 
        
        // Generate Kode Acak 6 Digit
        let teks = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let kodenya = "";
        for (let i = 0; i < 6; i++) { 
            kodenya += teks.charAt(Math.floor(Math.random() * teks.length)); 
        }
        
        document.getElementById('hasil').innerText = kodenya;
        document.getElementById('hasil').style.display = 'block';
        document.getElementById('btn').style.display = 'none';
        document.getElementById('judul').innerText = "Salin kodenya ke Bot:";
    }
</script>

</body>
</html>
