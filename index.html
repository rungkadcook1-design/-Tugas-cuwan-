<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Cuan - Verifikasi Aman</title>
    <style>
        /* PENGATURAN TEMA (CSS VARIABLES) */
        :root {
            --bg-body: #0f0f0f;
            --bg-container: #1a1a1a;
            --bg-step: #252525;
            --bg-ads: #222;
            --text-main: #ffffff;
            --text-muted: #888;
            --border-color: #333;
            --kode-bg: #000;
        }

        [data-theme="light"] {
            --bg-body: #f0f2f5;
            --bg-container: #ffffff;
            --bg-step: #f8f9fa;
            --bg-ads: #eeeeee;
            --text-main: #1a1a1a;
            --text-muted: #666;
            --border-color: #ddd;
            --kode-bg: #fdfdfd;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            text-align: center; 
            padding: 20px 10px; 
            margin: 0; 
            transition: 0.3s;
        }

        /* Tombol Toggle Tema */
        .theme-switch {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #2ecc71;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 999;
        }

        .container { 
            background: var(--bg-container); 
            padding: 25px; 
            border-radius: 20px; 
            display: inline-block; 
            width: 100%; 
            max-width: 400px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); 
            transition: 0.3s;
        }

        h2 { font-size: 20px; margin-bottom: 20px; color: #2ecc71; }
        
        .ads-box { 
            background: var(--bg-ads); 
            border-radius: 10px; 
            margin: 15px 0; 
            padding: 15px; 
            border: 1px dashed var(--border-color); 
            min-height: 60px;
        }

        .step-bar { 
            background: var(--bg-step); 
            padding: 20px; 
            border-radius: 15px; 
            margin-bottom: 20px; 
            border-left: 5px solid #e74c3c; 
            text-align: left; 
            transition: 0.4s;
            position: relative;
        }
        .step-title { font-size: 14px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
        .timer-val { font-size: 26px; color: #f39c12; font-weight: bold; float: right; }
        
        .btn { 
            background: linear-gradient(135deg, #2ecc71, #27ae60); 
            color: white; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            width: 100%; 
            font-weight: bold; 
            cursor: pointer; 
            display: none; 
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }
        .btn-next { background: linear-gradient(135deg, #3498db, #2980b9); }

        .kode-box { 
            background: var(--kode-bg); 
            padding: 20px; 
            border-radius: 10px; 
            color: #27ae60; 
            font-size: 32px; 
            font-weight: bold; 
            display: none; 
            margin-top: 20px; 
            border: 2px solid #2ecc71; 
            letter-spacing: 8px; 
            text-shadow: 0 0 5px rgba(46, 204, 113, 0.2);
        }
        
        .disabled { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        .active { opacity: 1; border-left: 5px solid #2ecc71; }
    </style>
</head>
<body>

<button class="theme-switch" id="toggleTheme">☀️ MODE TERANG</button>

<div class="container">
    <h2>🚀 PROSES KODE TUGAS</h2>

    <div class="step-bar active" id="bar1">
        <span class="timer-val" id="t1">20</span>
        <div class="step-title">Langkah 1: Cek Koneksi</div>
        <div class="ads-box">
            <p style="font-size:11px; color:#555;">[ IKLAN BANNER 320x50 ]</p>
        </div>
        <button id="btn1" class="btn btn-next" onclick="mulaiStep2()">LANJUT KE LANGKAH 2</button>
    </div>

    <div class="step-bar disabled" id="bar2">
        <span class="timer-val" id="t2">20</span>
        <div class="step-title">Langkah 2: Validasi Human</div>
        <div class="ads-box">
            <p style="font-size:11px; color:#555;">[ IKLAN BANNER 300x250 ]</p>
        </div>
        <button id="btn2" class="btn" onclick="tampilkanKodeFinal()">DAPATKAN KODE</button>
        <div id="kodeBox" class="kode-box"></div>
    </div>

    <p style="font-size: 11px; color: #555;">Selesaikan semua langkah untuk mendapatkan saldo.</p>
</div>

<script>
    // FUNGSI GANTI TEMA
    const toggleBtn = document.getElementById('toggleTheme');
    toggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if (currentTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'dark');
            toggleBtn.innerText = "☀️ MODE TERANG";
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            toggleBtn.innerText = "🌙 MODE GELAP";
        }
    });

    // Timer Step 1
    let s1 = 20;
    let h1 = setInterval(() => {
        s1--;
        document.getElementById('t1').innerText = s1;
        if (s1 <= 0) {
            clearInterval(h1);
            document.getElementById('t1').style.display = 'none';
            document.getElementById('btn1').style.display = 'block';
        }
    }, 1000);

    function mulaiStep2() {
        document.getElementById('bar1').classList.add('disabled');
        document.getElementById('btn1').innerText = "✅ SELESAI";
        document.getElementById('btn1').disabled = true;
        
        document.getElementById('bar2').classList.remove('disabled');
        document.getElementById('bar2').classList.add('active');

        let s2 = 20;
        let h2 = setInterval(() => {
            s2--;
            document.getElementById('t2').innerText = s2;
            if (s2 <= 0) {
                clearInterval(h2);
                document.getElementById('t2').style.display = 'none';
                document.getElementById('btn2').style.display = 'block';
            }
        }, 1000);
    }

    function tampilkanKodeFinal() {
        // Ganti link di bawah dengan Direct Link Adsterra kamu
        window.open("https://www.highrevenuegate.com/ganti-link-kamu-disini", "_blank");

        let chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let res = "";
        for (let i = 0; i < 6; i++) { 
            res += chars.charAt(Math.floor(Math.random() * chars.length)); 
        }
        
        document.getElementById('kodeBox').innerText = res;
        document.getElementById('kodeBox').style.display = 'block';
        document.getElementById('btn2').style.display = 'none';
    }
</script>

</body>
</html>
