<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Coba Banner Tugas</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; text-align: center; padding-top: 30px; margin: 0; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 20px; display: inline-block; width: 90%; max-width: 380px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Gaya Banner Tiruan */
        .fake-ads { width: 100%; background: #252525; border-radius: 8px; margin: 15px 0; overflow: hidden; border: 1px solid #444; position: relative; }
        .fake-ads img { width: 100%; display: block; filter: brightness(0.8); }
        .ad-label { position: absolute; top: 0; right: 0; background: rgba(0,0,0,0.5); color: #777; font-size: 9px; padding: 2px 5px; border-bottom-left-radius: 5px; }

        h3 { margin-bottom: 10px; color: #bbb; font-size: 18px; }
        #timer { font-size: 45px; margin: 15px 0; color: #ffcc00; font-weight: bold; }
        
        .tombol { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; display: none; width: 100%; font-size: 16px; text-transform: uppercase; }
        
        .kode-box { background: #2d2d2d; padding: 15px; border-radius: 12px; color: #00ff00; font-size: 28px; margin-top: 15px; display: none; border: 2px dashed #555; font-weight: bold; letter-spacing: 4px; }
        
        .instruksi { font-size: 12px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

<div class="box" id="mainBox">
    <div class="fake-ads">
        <span class="ad-label">Advertisement</span>
        <img src="https://via.placeholder.com/320x50/1a1a1a/00ff00?text=IKLAN+BANNER+320x50" alt="Iklan Atas">
    </div>

    <h3 id="judul">Selesaikan Tugas...</h3>
    <div id="timer">20</div>
    
    <button id="btn" class="tombol" onclick="ambilTugas()">Dapatkan Kode Sekarang</button>
    
    <div id="hasil" class="kode-box"></div>
    
    <div class="fake-ads">
        <span class="ad-label">Advertisement</span>
        <img src="https://via.placeholder.com/300x250/1a1a1a/ffcc00?text=IKLAN+VIDEO+/+BANNER+LARGE" alt="Iklan Bawah">
    </div>

    <p class="instruksi" id="info">Tunggu timer sampai tombol hijau muncul.</p>
</div>

<script>
    // TIMER JALAN OTOMATIS
    let detik = 20;
    let hitung = setInterval(() => {
        detik--;
        document.getElementById('timer').innerText = detik;
        if (detik <= 0) {
            clearInterval(hitung);
            document.getElementById('timer').style.display = 'none';
            document.getElementById('btn').style.display = 'block';
            document.getElementById('judul').innerText = "Tugas Selesai!";
        }
    }, 1000);

    function ambilTugas() {
        let teks = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let kodenya = "";
        for (let i = 0; i < 6; i++) { 
            kodenya += teks.charAt(Math.floor(Math.random() * teks.length)); 
        }
        
        document.getElementById('hasil').innerText = kodenya;
        document.getElementById('hasil').style.display = 'block';
        document.getElementById('btn').style.display = 'none';
        document.getElementById('judul').innerText = "KODE ANDA:";
        document.getElementById('info').innerText = "Salin kode di atas untuk klaim saldo di bot.";

        // Simulasi pindah ke iklan setelah 3 detik
        setTimeout(() => {
            alert("Sistem akan mengarahkan ke iklan...");
            // window.location.href = "LINK_IKLAN_ASLI_DISINI";
        }, 3000);
    }
</script>

</body>
</html>
