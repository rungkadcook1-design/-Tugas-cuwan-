<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Tugas Cuan</title>
    <style>
        /* Desain Dark Mode Profesional */
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; text-align: center; padding-top: 50px; margin: 0; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 20px; display: inline-block; width: 90%; max-width: 380px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        h3 { margin-bottom: 20px; color: #bbb; }
        #timer { font-size: 50px; margin: 20px 0; color: #ffcc00; font-weight: bold; }
        
        /* Tombol */
        .tombol { background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; padding: 18px 25px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; display: none; width: 100%; font-size: 18px; }
        
        /* Kotak Kode */
        .kode-box { background: #2d2d2d; padding: 20px; border-radius: 12px; color: #00ff00; font-size: 32px; margin-top: 20px; display: none; border: 2px dashed #555; font-weight: bold; letter-spacing: 5px; }
        
        .instruksi { font-size: 13px; color: #888; margin-top: 15px; }
        .status-iklan { color: #ff4757; font-weight: bold; font-size: 12px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="box" id="mainBox">
    <h3 id="judul">Tunggu Sebentar...</h3>
    <div id="timer">20</div>
    
    <button id="btn" class="tombol" onclick="ambilTugas()">KLIK AMBIL KODE</button>
    
    <div id="hasil" class="kode-box"></div>
    <p id="status" class="status-iklan">Mengarahkan ke iklan dalam 2 detik...</p>
    
    <p class="instruksi" id="info">Jangan tutup halaman sampai timer selesai.</p>
</div>

<script>
    // 1. ANTI-VPN & CEK NEGARA
    fetch('https://ipapi.co/json/').then(res => res.json()).then(data => {
        if (data.country !== "ID") {
            document.getElementById('mainBox').innerHTML = "<h3>AKSES DITOLAK</h3><p>Gunakan Internet Indonesia (Matikan VPN)!</p>";
        } else {
            mulaiTimer();
        }
    }).catch(() => mulaiTimer());

    // 2. JALANKAN TIMER
    function mulaiTimer() {
        let detik = 20;
        let hitung = setInterval(() => {
            detik--;
            document.getElementById('timer').innerText = detik;
            if (detik <= 0) {
                clearInterval(hitung);
                document.getElementById('timer').style.display = 'none';
                document.getElementById('btn').style.display = 'block';
                document.getElementById('judul').innerText = "Tugas Selesai!";
                document.getElementById('info').innerText = "Klik tombol di atas untuk melihat kode.";
            }
        }, 1000);
    }

    // 3. AMBIL KODE & PINDAH IKLAN
    function ambilTugas() {
        // Generate Kode Acak
        let teks = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let kodenya = "";
        for (let i = 0; i < 6; i++) { 
            kodenya += teks.charAt(Math.floor(Math.random() * teks.length)); 
        }
        
        // Tampilkan Kode
        document.getElementById('hasil').innerText = kodenya;
        document.getElementById('hasil').style.display = 'block';
        document.getElementById('btn').style.display = 'none';
        document.getElementById('status').style.display = 'block';
        document.getElementById('judul').innerText = "SALIN KODE INI:";
        document.getElementById('info').innerText = "Ingat kode di atas sebelum halaman berpindah.";

        // Pindah ke Iklan setelah 2.5 Detik (Tab yang sama)
        setTimeout(() => {
            // --- GANTI LINK DI BAWAH INI DENGAN DIRECT LINK IKLAN KAMU ---
            window.location.href = "https://www.highrevenuegate.com/example-link"; 
        }, 2500);
    }
</script>

</body>
</html>
