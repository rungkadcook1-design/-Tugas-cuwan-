<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Info & Reward Page</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0f1225;
    color:white;
}

.container{
    max-width:420px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1c2140;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

.btn{
    display:block;
    padding:12px;
    background:#2ecc71;
    color:white;
    text-align:center;
    border-radius:8px;
    text-decoration:none;
    margin-top:10px;
}

.aff{
    background:white;
    color:black;
    border-radius:12px;
    overflow:hidden;
}

.aff img{
    width:100%;
}

.timer{
    color:#ffcc00;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">
        <h3>📊 Informasi Tugas</h3>
        <p>Silakan lihat konten & penawaran di bawah ini.</p>
        <span class="timer" id="t">5</span> detik UX delay
    </div>

    <div class="card aff">
        <img src="https://img.freepik.com/free-photo/fashion-male-accessories-flat-lay_23-2148115456.jpg">
        <div style="padding:10px;">
            <b>Produk Affiliate</b>
            <p>Link resmi partner (transparan)</p>

            <a href="https://example.com"
               class="btn"
               target="_blank"
               onclick="track('affiliate_click')">
               Kunjungi Produk
            </a>
        </div>
    </div>

    <div class="card">
        <b>🎁 Reward Page</b>
        <p>Jika tertarik, lanjut ke halaman berikutnya</p>

        <a href="https://example.com/reward"
           class="btn"
           target="_blank"
           onclick="track('reward_click')">
           Lanjut
        </a>
    </div>

</div>

<script>
const userId = new URLSearchParams(window.location.search).get("id") || 0;

/* SAFE TRACKING (analytics only) */
function track(action){
    fetch("https://YOUR-BOT-API.com/track",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
            user_id: userId,
            action: action,
            time: Date.now()
        })
    });
}

/* UX TIMER (bukan paksa klik) */
let t = 5;
let i = setInterval(()=>{
    t--;
    document.getElementById("t").innerText = t;
    if(t<=0){
        clearInterval(i);
        document.getElementById("t").innerText = "✔";
    }
},1000);
</script>

</body>
</html>
