<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="CuanamanBot - Ambil tugas, selesaikan step, dapatkan reward.">
<meta name="theme-color" content="#0f172a">
<title>CuanamanBot - Ambil Tugas</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#0ea5e9);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:#fff;
}

.container{
width:100%;
max-width:430px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);
border-radius:22px;
padding:28px;
box-shadow:0 15px 35px rgba(0,0,0,.35);
text-align:center;
}

.logo{font-size:28px;font-weight:700;margin-bottom:8px}
.sub{font-size:14px;opacity:.85;margin-bottom:20px;line-height:1.4}

.banner{
width:100%;
height:90px;
border:2px dashed rgba(255,255,255,.35);
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:20px;
font-size:14px;
padding:10px;
text-align:center;
}

.box{
background:rgba(255,255,255,.08);
padding:18px;
border-radius:16px;
}

.step{
font-size:14px;
font-weight:700;
color:#67e8f9;
margin-bottom:12px;
}

#timer{
font-size:56px;
font-weight:700;
color:#67e8f9;
margin:15px 0;
display:none;
}

.panel{
display:none;
padding:15px;
border-radius:14px;
background:#082f49;
border:1px solid #38bdf8;
margin-top:14px;
}

#code{
font-size:34px;
font-weight:700;
letter-spacing:4px;
margin:10px 0;
color:#22d3ee;
}

input{
width:100%;
padding:13px;
border:none;
outline:none;
border-radius:12px;
font-size:16px;
margin-top:10px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
font-size:16px;
font-weight:700;
cursor:pointer;
background:#22c55e;
color:#fff;
margin-top:10px;
transition:.2s;
}

button:hover{
transform:scale(1.02);
background:#16a34a;
}

.copyBtn{
background:#f59e0b;
}

.copyBtn:hover{
background:#d97706;
}

.small{
font-size:13px;
opacity:.85;
margin-top:12px;
line-height:1.5;
}

.footer{
margin-top:18px;
font-size:12px;
opacity:.7;
}

.success{color:#86efac}
.error{color:#fca5a5}
</style>
</head>

<body oncontextmenu="return false">

<div class="container">

<div class="logo">💎 CuanamanBot</div>

<div class="sub">
Selesaikan Multi-Step Task dan dapatkan reward otomatis
</div>

<div class="banner">
ADS BANNER / MONETAG / ADSTERRA
</div>

<div class="box">

<div class="step" id="stepText">STEP 1 / 3</div>

<div id="mainText">🎁 Klik tombol untuk memulai tugas</div>

<div id="timer">10</div>

<button id="startBtn" onclick="startTask()">🎁 MULAI TUGAS</button>

<div class="panel" id="captchaPanel">
<div id="captchaQuestion">2 + 2 = ?</div>
<input type="number" id="captchaInput" placeholder="Masukkan jawaban">
<button onclick="verifyCaptcha()">✅ VERIFIKASI CAPTCHA</button>
</div>

<div class="panel" id="codePanel">
<div>KODE VERIFIKASI</div>
<div id="code">------</div>
<button class="copyBtn" onclick="copyCode()">📋 COPY CODE</button>
<div class="small">Salin kode lalu kirim ke bot Telegram</div>
</div>

<div class="small" id="status">Menunggu user memulai...</div>

</div>

<div class="footer">
Blue Modern Funnel v12 Protected Edition
</div>

</div>

<script>
(function(){

/* anti inspect */
document.addEventListener("keydown",function(e){
if(e.key==="F12") e.preventDefault();
if(e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key.toUpperCase())) e.preventDefault();
if(e.ctrlKey && e.key.toUpperCase()==="U") e.preventDefault();
});

/* anti bot */
if(navigator.webdriver || window.innerWidth<250){
document.body.innerHTML="<h2 style='text-align:center;color:white'>Access Denied</h2>";
throw new Error("blocked");
}

/* obfuscated style variables */
var p=new URLSearchParams(location.search);
var u=parseInt(p.get("id"))||12345;
var t=parseInt(p.get("ts"))||Math.floor(Date.now()/1000);

var c=10;
var r=null;
var a=0;
var b=0;

window.startTask=function(){

gid("startBtn").style.display="none";
gid("timer").style.display="block";

txt("stepText","STEP 2 / 3");
txt("mainText","⏳ Menunggu verifikasi trafik...");
txt("status","Sistem memvalidasi user...");

r=setInterval(function(){

txt("timer",c);
c--;

if(c<0){
clearInterval(r);
showCaptcha();
}

},1000);

};

window.showCaptcha=function(){

gid("timer").style.display="none";
gid("captchaPanel").style.display="block";

a=Math.floor(Math.random()*9)+1;
b=Math.floor(Math.random()*9)+1;

txt("captchaQuestion",a+" + "+b+" = ?");
txt("status","Selesaikan captcha untuk lanjut.");

};

window.verifyCaptcha=function(){

var v=parseInt(gid("captchaInput").value);

if(v===a+b){
gid("captchaPanel").style.display="none";
showCode();
}else{
gid("status").innerHTML="<span class='error'>Captcha salah.</span>";
}

};

window.showCode=function(){

txt("stepText","STEP 3 / 3");
txt("mainText","🎉 Tugas selesai!");
gid("codePanel").style.display="block";

var n=Math.floor(t/240);
var code=String((u+n)*3).slice(-6);

txt("code",code);

gid("status").innerHTML="<span class='success'>Kode berhasil dibuat.</span>";

setTimeout(function(){
window.open("https://example.com","_blank");
},3000);

};

window.copyCode=function(){

navigator.clipboard.writeText(gid("code").innerText).then(function(){
gid("status").innerHTML="<span class='success'>Kode berhasil disalin.</span>";
}).catch(function(){
gid("status").innerHTML="<span class='error'>Gagal copy.</span>";
});

};

function gid(x){
return document.getElementById(x);
}

function txt(i,v){
gid(i).innerText=v;
}

/* anti devtools */
setInterval(function(){
var w=window.outerWidth-window.innerWidth>160;
var h=window.outerHeight-window.innerHeight>160;
if(w||h){
document.body.innerHTML="<h2 style='text-align:center;color:white'>DevTools Blocked</h2>";
}
},1000);

})();
</script>

</body>
</html>
