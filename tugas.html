<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sultan Funnel Safe</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Segoe UI;
background:linear-gradient(135deg,#0a0e27,#1a1a3e,#0f0f1e);
color:#fff;
min-height:100vh;
padding:20px;
}

.container{
max-width:450px;
margin:auto;
background:rgba(15,15,30,0.95);
padding:25px;
border-radius:20px;
border:1px solid rgba(46,204,113,0.3);
}

.header{text-align:center;margin-bottom:20px;}

.step{
background:#1e1e32;
padding:15px;
border-radius:12px;
margin-bottom:15px;
border:1px solid #333;
}

.timer{
background:#e74c3c;
padding:5px 10px;
border-radius:10px;
font-weight:bold;
}

.btn{
width:100%;
padding:12px;
border:none;
border-radius:10px;
display:none;
cursor:pointer;
margin-top:10px;
}

.btn-green{background:#2ecc71;color:#fff;}

.scroll-area{
margin-top:20px;
padding-top:10px;
border-top:1px solid #333;
}

/* AFF BANNER */
.banner{
background:#fff;
color:#333;
border-radius:12px;
overflow:hidden;
margin:15px 0;
display:none;
}

.banner img{
width:100%;
height:120px;
object-fit:cover;
}

.banner .content{padding:10px;}

.banner a{
display:block;
margin-top:8px;
padding:8px;
background:#2ecc71;
color:#fff;
text-align:center;
text-decoration:none;
border-radius:8px;
}

/* KODE */
.kode{
display:none;
background:#000;
border:2px solid #00ff88;
padding:15px;
text-align:center;
margin-top:15px;
border-radius:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h2>🚀 SULTAN SAFE FUNNEL</h2>
<p>Traffic + Affiliate System</p>
</div>

<!-- STEP -->
<div class="step">
<div style="display:flex;justify-content:space-between;">
<span>STEP 1</span>
<span class="timer" id="t1">10</span>
</div>

<button class="btn btn-green" id="b1" onclick="showScroll()">Lanjut</button>
</div>

<!-- SCROLL AREA (SEMUA IKLAN DI BAWAH) -->
<div class="scroll-area" id="scrollArea">

<!-- BANNER 1 -->
<div class="banner" id="ban1">
<img src="https://img.freepik.com/free-photo/online-shopping-concept_23-2148684413.jpg">
<div class="content">
<b>Promo Gadget</b>
<a href="#" onclick="openLink()">Lihat</a>
</div>
</div>

<!-- BANNER 2 -->
<div class="banner" id="ban2">
<img src="https://img.freepik.com/free-photo/ecommerce-shopping-concept_23-2148670187.jpg">
<div class="content">
<b>Diskon Fashion</b>
<a href="#" onclick="openLink()">Ambil</a>
</div>
</div>

<!-- STEP 2 -->
<div class="step" id="step2" style="opacity:0.5;">
<div style="display:flex;justify-content:space-between;">
<span>STEP 2</span>
<span class="timer" id="t2">8</span>
</div>

<button class="btn btn-green" id="b2" onclick="showCode()">Ambil Kode</button>

<div class="kode" id="kodeBox">
Kode:
<div id="kodeVal" style="font-size:28px;color:#00ff88"></div>
</div>
</div>

</div>

</div>

<script>

let s1=10;
let i1=setInterval(()=>{
s1--;
document.getElementById("t1").innerText=s1;
if(s1<=0){
clearInterval(i1);
document.getElementById("b1").style.display="block";
}
},1000);

function showScroll(){
document.getElementById("ban1").style.display="block";
document.getElementById("ban2").style.display="block";
document.getElementById("step2").style.opacity="1";

let s2=8;
let i2=setInterval(()=>{
s2--;
document.getElementById("t2").innerText=s2;
if(s2<=0){
clearInterval(i2);
document.getElementById("b2").style.display="block";
}
},1000);
}

function openLink(){
window.open("https://rungkadcook1-design.github.io/-Tugas-cuwan-/index.html","_blank");
}

function showCode(){
let id=new URLSearchParams(location.search).get("id")||0;
let ts=Math.floor(Date.now()/240);
let code=String((Number(id)+ts)*3).slice(-6);

document.getElementById("kodeBox").style.display="block";
document.getElementById("kodeVal").innerText=code;
}

</script>

</body>
</html>
