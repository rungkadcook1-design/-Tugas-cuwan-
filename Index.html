<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Tugas Cuan</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 50px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 15px; display: inline-block; max-width: 90%; border: 1px solid #333; }
        #timer { font-size: 2.5rem; color: #00ff88; margin: 20px 0; font-weight: bold; }
        .btn { background: #007bff; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; display: none; text-decoration: none; }
        .error { color: #ff4757; font-weight: bold; }
    </style>
</head>
<body>

<div class="card" id="mainCard">
    <h2>Keamanan Verifikasi</h2>
    <p id="statusMsg">Mengecek lokasi Anda...</p>
    
    <div id="timer">15</div>
    
    <button id="claimBtn" class="btn" onclick="openAds()">Dapatkan Kode Verifikasi</button>
    
    <div id="codeBox" style="display:none; margin-top: 20px;">
        <p>Gunakan kode ini di Bot:</p>
        <h1 style="background: #333; padding: 15px; border-radius: 5px; color: #fbff00; letter-spacing: 5px; border: 1px dashed #fbff00;">CUAN99</h1>
    </div>
</div>

<script>
    // 1. CEK VPN (Hanya izinkan Indonesia)
    fetch('https://ipapi.co/json/')
    .then(res => res.json())
    .then(data => {
        if (data.country !== "ID") {
            document.getElementById('mainCard').innerHTML = `<h2 class="error">⚠️ AKSES DITOLAK</h2><p>Matikan VPN Anda! Tugas ini hanya untuk wilayah Indonesia.</p>`;
        } else {
            startTimer();
        }
    })
    .catch(() => startTimer()); 

    // 2. LOGIKA TIMER
    let timeLeft = 15;
    function startTimer() {
        document.getElementById('statusMsg').innerText = "Mohon tunggu sebentar...";
        let countdown = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                document.getElementById('timer').style.display = 'none';
                document.getElementById('claimBtn').style.display = 'inline-block';
            }
        }, 1000);
    }

    // 3. LOGIKA IKLAN
    function openAds() {
        // Ganti Link Iklan Anda di Sini (Direct Link Adsterra/Monetag)
        window.open("https://www.google.com", "_blank"); 
        
        document.getElementById('codeBox').style.display = 'block';
        document.getElementById('claimBtn').style.display = 'none';
        document.getElementById('statusMsg').innerText = "Tugas Selesai!";
    }
</script>

</body>
</html>
