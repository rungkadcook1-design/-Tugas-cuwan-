<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Cuan - Verifikasi Aman Sultan</title>
    <style>
        /* CSS Dark Mode Mewah */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f0f0f; 
            color: white; 
            text-align: center; 
            padding: 20px 10px; 
            margin: 0; 
            user-select: none; /* Anti Copy-Paste */
        }
        .container { 
            background: #1a1a1a; 
            padding: 25px; 
            border-radius: 20px; 
            display: inline-block; 
            width: 100%; 
            max-width: 400px; 
            border: 1px solid #333; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); 
        }
        h2 { font-size: 20px; margin-bottom: 20px; color: #2ecc71; }
        
        .ads-box { 
            background: #222; 
            border-radius: 10px; 
            margin: 15px 0; 
            padding: 15px; 
            border: 1px dashed #444; 
            min-height: 60px;
        }

        .step-bar { 
            background: #252525; 
            padding: 20px; 
            border-radius: 15px; 
            margin-bottom: 20px; 
            border-left: 5px solid #e74c3c; 
            text-align: left; 
            transition: 0.4s;
            position: relative;
        }
        .step-title { font-size: 14px; color: #888; font-weight: bold; text-transform: uppercase; }
        .timer-val { font-size: 26px; color: #ffcc00; font-weight: bold; float: right; }
        
        .btn { 
            background: linear-gradient(135deg, #2ecc71, #27ae60); 
            color: white; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            width: 100%; 
            font-weight: bold; 
            cursor: pointer; 
            display: none; 
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }
        .btn-next { background: linear-gradient(135deg, #3498db, #2980b9); }

        .kode-box { 
            background: #000; 
            padding: 20px; 
            border-radius: 10px; 
            color: #00ff00; 
            font-size: 32px; 
            font-weight: bold; 
            display: none; 
            margin-top: 20px; 
            border: 2px solid #00ff00; 
            letter-spacing: 8px; 
            text-shadow: 0 0 10px #00ff00;
        }
        
        .disabled { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        .active { opacity: 1; border-left: 5px solid #2ecc71; }
    </style>

    <script type="text/javascript">
        /* --- FITUR KEAMANAN SULTAN --- */
        // Matikan Klik Kanan
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Matikan F12 & Inspect Element
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };
    </script>
</head>
<body>

<div class="container">
    <h2>🚀 PROSES KODE TUGAS</h2>

    <div class="step-bar active" id="bar1">
        <span class="timer-val" id="t1">20</span>
        <div class="step-title">Langkah 1: Cek Koneksi</div>
        <div class="ads-box">
            <p style="font-size:11px; color:#555;">[ IKLAN BANNER 320x50 ]</p>
        </div>
        <button id="btn1" class="btn btn-next" onclick="mulaiStep2()">LANJUT KE LANGKAH 2</button>
    </div>

    <div class="step-bar disabled" id="bar2">
        <span class="timer-val" id="t2">20</span>
        <div class="step-title">Langkah 2: Validasi Human</div>
        <div class="ads-box">
            <p style="font-size:11px; color:#555;">[ IKLAN BANNER 300x250 ]</p>
        </div>
        <button id="btn2" class="btn" onclick="tampilkanKodeFinal()">DAPATKAN KODE</button>
        <div id="kodeBox" class="kode-box"></div>
    </div>

    <p style="font-size: 11px; color: #555;">Selesaikan semua langkah untuk mendapatkan saldo.</p>
</div>

<script>
    /* --- LOGIKA TIMER --- */
    let s1 = 20;
    let h1 = setInterval(() => {
        s1--;
        document.getElementById('t1').innerText = s1;
        if (s1 <= 0) {
            clearInterval(h1);
            document.getElementById('t1').style.display = 'none';
            document.getElementById('btn1').style.display = 'block';
        }
    }, 1000);

    function mulaiStep2() {
        document.getElementById('bar1').classList.add('disabled');
        document.getElementById('btn1').innerText = "✅ SELESAI";
        document.getElementById('btn1').disabled = true;
        
        document.getElementById('bar2').classList.remove('disabled');
        document.getElementById('bar2').classList.add('active');

        let s2 = 20;
        let h2 = setInterval(() => {
            s2--;
            document.getElementById('t2').innerText = s2;
            if (s2 <= 0) {
                clearInterval(h2);
                document.getElementById('t2').style.display = 'none';
                document.getElementById('btn2').style.display = 'block';
            }
        }, 1000);
    }

    function tampilkanKodeFinal() {
        /* 1. Buka Direct Link Iklan (Ganti dengan Link Adsterra Kamu) */
        window.open("https://www.highrevenuegate.com/ganti-link-kamu-disini", "_blank");

        /* 2. Logika Reverse ID (Sinkron dengan Bot) */
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id'); 

        if (!userId) {
            alert("⚠️ Akses Ditolak! Gunakan Link dari Bot.");
            return;
        }

        // Ambil ID, balikkan urutannya, ambil 6 angka pertama
        let balikId = userId.split("").reverse().join("");
        let kodeFinal = balikId.substring(0, 6);
        
        /* 3. Tampilkan Kode */
        document.getElementById('kodeBox').innerText = kodeFinal;
        document.getElementById('kodeBox').style.display = 'block';
        document.getElementById('btn2').style.display = 'none';
    }
</script>

</body>
</html>
