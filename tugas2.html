<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sultan Task - OTP System</title>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: white; text-align: center; padding: 20px; user-select: none; }
        .container { background: #1a1a1a; padding: 20px; border-radius: 15px; max-width: 400px; display: inline-block; border: 1px solid #333; }
        .instruction { background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 12px; color: #ffcc00; font-weight: bold; }
        .step-bar { background: #252525; padding: 15px; border-radius: 10px; margin-bottom: 10px; text-align: left; }
        .timer-val { float: right; color: #ffcc00; font-weight: bold; }
        .btn { background: #2ecc71; color: white; padding: 12px; border: none; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; display: none; margin-top: 10px; }
        .kode-box { background: #000; padding: 15px; border-radius: 8px; color: #00ff00; font-size: 28px; font-weight: bold; display: none; margin-top: 15px; border: 2px solid #00ff00; letter-spacing: 5px; }
        .disabled { opacity: 0.3; pointer-events: none; }
        
        /* Gaya untuk Box Iklan */
        .ads-slot {
            background: #222;
            margin: 10px 0;
            padding: 10px;
            border: 1px dashed #444;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="instruction">
        [KALO SUDAH 40 DETIK TEKAN TOMBOL DAPATKAN CODE TUNGGU LOADING 5 DETIK JANGAN KEMBALI DULU TEKAN TANDA X DI ATAS AGAR CODE DAPAT BILA LANGSUNG KEMBALI CODE HARUS DI ULANG LAGI]
    </div>

    <div id="bar1" class="step-bar">
        <span id="t1" class="timer-val">20</span>
        Langkah 1: Menyiapkan Data...
        
        <div class="ads-slot">
            IKLAN BANNER 1
        </div>

        <button id="btn1" class="btn" onclick="nextStep()">LANJUT</button>
    </div>

    <div id="bar2" class="step-bar disabled">
        <span id="t2" class="timer-val">20</span>
        Langkah 2: Verifikasi Iklan...

        <div class="ads-slot">
            IKLAN BANNER 2
        </div>

        <button id="btn2" class="btn" onclick="generateOTP()">DAPATKAN KODE</button>
        <div id="kodeBox" class="kode-box"></div>
    </div>
</div>

<script>
    let s1 = 20, s2 = 20;
    let h1 = setInterval(() => {
        s1--; document.getElementById('t1').innerText = s1;
        if(s1<=0){ clearInterval(h1); document.getElementById('t1').style.display='none'; document.getElementById('btn1').style.display='block'; }
    }, 1000);

    function nextStep() {
        document.getElementById('bar1').classList.add('disabled');
        document.getElementById('bar2').classList.remove('disabled');
        let h2 = setInterval(() => {
            s2--; document.getElementById('t2').innerText = s2;
            if(s2<=0){ clearInterval(h2); document.getElementById('t2').style.display='none'; document.getElementById('btn2').style.display='block'; }
        }, 1000);
    }

    function generateOTP() {
        // GANTI LINK DI BAWAH DENGAN DIRECT LINK ADSTERRA KAMU
        window.open("https://www.highrevenuegate.com/ganti-link-kamu-disini", "_blank");
        
        const urlParams = new URLSearchParams(window.location.search);
        const userId = parseInt(urlParams.get('id'));

        if(!userId) return alert("Buka dari bot!");

        document.getElementById('btn2').innerText = "⌛ LOADING 5 DETIK...";
        document.getElementById('btn2').disabled = true;

        setTimeout(() => {
            let waktu = Math.floor(Date.now() / 1000 / 240);
            let hitung = (userId + waktu) * 3;
            let kodeFinal = hitung.toString().slice(-6);

            document.getElementById('kodeBox').innerText = kodeFinal;
            document.getElementById('kodeBox').style.display = 'block';
            document.getElementById('btn2').style.display = 'none';
            alert("⚠️ KODE BERLAKU 4 MENIT! Segera masukkan ke Bot.");
        }, 5000);
    }
</script>
</body>
</html>
